[workspace]
members = [
    "crates/agsv-cli",
    "crates/agsv-core",
    "crates/agsv-protocol",
    "crates/agsv-runtime",
    "crates/agsv-session",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kumaaa-inc/agent-supervisor"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
