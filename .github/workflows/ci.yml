name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run agsv-control tests
        shell: bash
        run: |
          set -o pipefail
          timeout --kill-after=30s 12m \
            cargo test -p agsv-control --all-features --locked -- --nocapture --test-threads=1 \
            2>&1 | tee agsv-control-test.log

      - name: Run remaining tests
        run: cargo test --workspace --exclude agsv-control --all-features --locked

      - name: Upload agsv-control test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agsv-control-test-log
          path: agsv-control-test.log
          if-no-files-found: error

      - name: Verify generated protocol schemas
        run: |
          cargo run --locked -p agsv-protocol --example generate-schemas -- schemas
          git diff --exit-code -- schemas
