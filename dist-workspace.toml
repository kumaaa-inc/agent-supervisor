[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Only the CLI is a distributable application; the remaining workspace crates
# are internal libraries.
packages = ["agsv-cli"]
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Match cargo install's conventional destination for the shell installer.
install-path = "CARGO_HOME"
# Produce SHA-256 checksums and GitHub/Sigstore provenance for public releases.
checksum = "sha256"
github-attestations = true

# Keep generated release workflows on the reviewed checkout v7 implementation.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
