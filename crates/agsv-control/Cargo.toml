[package]
name = "agsv-control"
description = "Embedded durable control plane for Agent Supervisor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
agsv-core = { version = "0.2.0", path = "../agsv-core" }
agsv-protocol = { version = "0.2.0", path = "../agsv-protocol" }
agsv-runtime = { version = "0.2.0", path = "../agsv-runtime" }
agsv-session = { version = "0.2.0", path = "../agsv-session" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
