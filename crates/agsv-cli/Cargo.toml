[package]
name = "agsv-cli"
description = "Agent Supervisor command-line client and embedded control plane"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "agsv"
path = "src/main.rs"

[dependencies]
agsv-control = { version = "0.2.0", path = "../agsv-control" }
agsv-core = { path = "../agsv-core" }
clap = { version = "4.6.6", features = ["derive"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[lints]
workspace = true
