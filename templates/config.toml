schema_version = 1

[workspace]
# These two paths are the v0.1 compatibility inputs. In this explicit-profile
# template, edit each [agent_profiles.*].role_file below instead.
primary_role = ".agent-supervisor/roles/primary-orchestrator.md"
implementation_role = ".agent-supervisor/roles/implementation-orchestrator.md"
primary_profile = "primary"
default_team_profile = "implementation"
# Optional local branch used only for base-staleness reports. When absent, AGSV
# uses the canonical primary worktree's attached branch. A detached or unborn
# primary worktree has no comparison target and reports that without failing.
# integration_branch = "release/current"

[runtime]
# Lifecycle backend and runtime adapter are independent. This selects the
# default backend for new sessions; each durable session records its owner.
backend = "herdr"
state_directory = ".agent-supervisor/runtime"

[implementation]
# v0.1 compatibility inputs. Explicit v0.2 profiles below are authoritative
# for runtime, model, and reasoning effort.
runtime = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"

# Persistent top-level actor profiles. Capability strings are deliberately
# open-ended; roles are descriptive and do not grant privileges by themselves.
# Runtime-launched profiles independently select their provider-neutral adapter.
# The human-facing Primary is bound to the pane that bootstraps it and is never
# launched by AGSV, so runtime/model/effort do not apply to that profile.
[agent_profiles.primary]
role = "primary"
capabilities = ["human_facing_primary"]
launch = "bound"
role_file = ".agent-supervisor/roles/primary-orchestrator.md"

[agent_profiles.implementation]
role = "implementation"
capabilities = ["implementation_execution"]
launch = "runtime"
runtime = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
role_file = ".agent-supervisor/roles/implementation-orchestrator.md"

# Desired counts and assignment policies are durable team intent. Team create,
# resume, and reconcile enforce the count; request creation enforces the policy.
[team_profiles.implementation]
actor_profile = "implementation"
# Zero declaratively disables persistent instances without deleting the profile.
desired_instances = 1
# Supported effective policies are first_healthy and least_wip. The protocol ID
# remains open so future policy names can be added without a domain-schema enum.
assignment_policy = "first_healthy"

[session_layout]
# Presentation policy only: purpose, labels, tabs, and panes never affect
# durable actor/session identity, authorization, assignments, or fencing.
max_panes_per_tab = 2
place_first_implementation_with_primary = true
tab_label_strategy = "sequence"
# Available placeholders: {session_label}, {team_purpose},
# and {active_request_title}.
pane_label_template = "{session_label}"
split_direction = "right"
focus_new_sessions = false

[review]
# Review verification is project-declared and tool-neutral. An empty suite is
# reported honestly by status/doctor and cannot produce a passing run. Commands
# are argv arrays passed directly to the selected executable without an
# AGSV-added shell; a project may intentionally select an interpreter.
# `environment` may point build outputs at child-writable `{artifacts}` or
# `{temp}` directories so the source checkout can remain read-only. Captured
# stdout/stderr is stored separately in controller-only evidence files. Literal
# values are durable public plan configuration; use an exact `{inherit}` value
# for a secret/ambient value so only its digest is recorded after expansion.
optional_binaries = []
environment = {}

# [[review.tool_versions]]
# id = "project-tool"
# argv = ["project-tool", "--version"]

# [[review.checks]]
# id = "project-tests"
# argv = ["project-tool", "test"]
# expected_exit_code = 0
# timeout_seconds = 3600
# required_absent_binaries = []

[policy]
# The controller is embedded rather than a continuously heartbeating daemon,
# so defaults tolerate long human review and implementation turns. Projects that
# run an external monitor may safely shorten both values together.
primary_lease_seconds = 3600
actor_heartbeat_seconds = 300
